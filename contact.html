<style>
/* CONTACT PAGE CARD */
.contact-page{
  display:flex;
  justify-content:center;
  padding-top:32px;
  padding-bottom:48px;
}

.contact-card{
  width:100%;
  max-width:720px;
  padding:28px;
  border-radius:24px;
  background:linear-gradient(145deg, rgba(35,35,35,.96), rgba(8,8,8,.98));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.contact-head{
  text-align:center;
  margin-bottom:24px;
}

.contact-head h1{
  margin:0 0 8px;
  letter-spacing:2px;
}

.contact-head p{
  margin:0;
  color:rgba(255,255,255,.72);
}

.contact-form{
  display:grid;
  gap:16px;
}

.contact-form label{
  color:#cfcfcf;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  opacity:0.9;
}

.contact-form input,
.contact-form textarea{
  width:100%;
  box-sizing:border-box;
  border:none;
  outline:none;
  border-radius:14px;
  padding:14px 15px;
  background:rgba(255,255,255,.09);
  color:#fff;
  border:1px solid rgba(255,255,255,.14);
  font:inherit;
}

.contact-form input:focus,
.contact-form textarea:focus{
  border-color:rgba(255,255,255,.45);
  background:rgba(255,255,255,.13);
}

.contact-form textarea{
  resize:vertical;
  min-height:140px;
}

.contact-submit{
  margin-top:8px;
  border:none;
  border-radius:999px;
  padding:15px 18px;
  font-weight:900;
  letter-spacing:1.5px;
  cursor:pointer;
  color:#111;
  background:linear-gradient(135deg, #fff, #bdbdbd);
  box-shadow:0 8px 22px rgba(255,255,255,.14);
}

.contact-submit:hover{
  transform:translateY(-1px);
}

.contact-direct{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.12);
  text-align:center;
  color:rgba(255,255,255,.72);
}

.contact-direct a{
  color:#fff;
  font-weight:800;
  text-decoration:none;
  margin-left:6px;
}

@media(max-width:700px){
  .contact-card{
    padding:22px;
    border-radius:20px;
  }
}
</style>
<style>
    /* Square-inspired header; original supplied logo is embedded unchanged. */
    .ot-site-header {position:relative;z-index:50;background:#000;color:#fff;width:100%;margin:0;padding:0;border:0;font-family:Arial,Helvetica,sans-serif;box-shadow:none}
    .ot-site-header * {box-sizing:border-box}
    .ot-nav-inner {height:90px;max-width:1400px;margin:auto;padding:0 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
    .ot-brand {display:block;width:260px;max-width:100%;line-height:0;background:#000}
    .ot-brand img {display:block;width:100%;height:auto;max-height:74px;object-fit:contain;margin:0;border:0;border-radius:0}
    .ot-menu-toggle {display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:8px;background:transparent;color:#fff;border:0;border-radius:0;box-shadow:none;cursor:pointer;justify-self:start}
    .ot-site-header svg {display:block;width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    #ot-site-menu {position:absolute;top:100%;left:0;right:0;background:#000;border-top:1px solid #292929;padding:12px 24px 20px;box-shadow:0 12px 20px #0005}
    #ot-site-menu[hidden] {display:none!important}
    #ot-site-menu a {display:block;padding:14px 8px;color:#fff;text-decoration:none;font:500 16px/1.4 Arial,sans-serif;letter-spacing:0;text-transform:none;border-bottom:1px solid #242424}
    #ot-site-menu a:hover {background:#181818}
    .ot-site-header a:focus-visible,.ot-site-header button:focus-visible {outline:2px solid #fff;outline-offset:3px}
    @media(max-width:800px) {
      .ot-nav-inner {height:72px;padding:0 12px;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px}
      .ot-brand {width:190px;justify-self:center}
    }
    @media(min-width:1000px) {
      .ot-nav-inner {height:96px}
      #ot-site-menu {padding-left:max(24px,calc((100% - 1400px)/2 + 24px))}
    }


html, body {margin:0;background:#000;color:#d0d0d0}
body {font-family:Arial,Helvetica,sans-serif}
body main.container {width:100%;max-width:1200px;margin:0 auto;padding:32px 20px 48px;box-sizing:border-box;background:#000}
body .footer {background:#000;color:#aaa;border-top:1px solid #333;padding:24px;text-align:center;font:14px/1.5 Arial,sans-serif}
body h1 {color:#dedede;font-size:clamp(30px,5vw,48px);line-height:1.15}
@supports ((background-clip:text) or (-webkit-background-clip:text)) {
 body main h1 {background:linear-gradient(180deg,#fff 0%,#e4e4e4 32%,#aaa 49%,#eee 53%,#b8b8b8 78%,#f1f1f1 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
}
@media(forced-colors:active) {body main h1 {background:none;color:CanvasText}}
#ot-site-menu a[aria-current="page"] {color:#c8c8c8}
.contact-page .contact-card {background:#000;border:1px solid #333;border-radius:8px;box-shadow:none;box-sizing:border-box;min-width:0}
.contact-head p,.contact-form label {color:#c8c8c8}
.contact-form input,.contact-form textarea {background:#141414;border:1px solid #555;border-radius:5px;margin-top:8px;color:#eee;font:16px/1.5 Arial,sans-serif}
.contact-form input:focus,.contact-form textarea:focus {outline:2px solid #c8c8c8;outline-offset:2px;border-color:#c8c8c8;background:#181818}
.contact-form .contact-submit {background:linear-gradient(180deg,#f1f1f1 0%,#c8c8c8 48%,#aaa 52%,#ddd 100%);color:#000;border-radius:4px;box-shadow:none;min-height:48px}
.contact-form .contact-submit:hover {background:#eeeeee}
.contact-direct a {color:#c8c8c8;overflow-wrap:anywhere}
.contact-direct {line-height:1.7}
.gallery-heading {padding:8px 0 24px}
.gallery-heading h1 {margin:0 0 12px;letter-spacing:2px}
.gallery-heading p {color:#c8c8c8;margin:0;line-height:1.6}
.gallery .gallery-card {background:#111;border:1px solid #444;border-radius:5px}
.gallery .gallery-card:hover {border-color:#c8c8c8}
.gallery-modal img {border-color:#777;border-radius:4px}
.gallery-close,.gallery-nav {color:#c8c8c8}
main a:focus-visible,main button:focus-visible {outline:2px solid #c8c8c8;outline-offset:3px}

</style>

<main class="container contact-page">
  <section class="contact-card">

    <div class="contact-head">
      <h1>CONTACT</h1>
      <p>Send us a message — your email app will open automatically.</p>
    </div>

    <form class="contact-form" id="contactForm">
      <label>
        Name
        <input type="text" id="name" required>
      </label>

      <label>
        Email
        <input type="email" id="email" required>
      </label>

      <label>
        Phone
        <input type="tel" id="phone">
      </label>

      <label>
        Message
        <textarea id="message" required></textarea>
      </label>

      <button type="submit" class="contact-submit">SEND MESSAGE</button>
    </form>

    <div class="contact-direct">
      <span>Or email directly:</span>
      <a href="mailto:sales@offroadtactical.com">sales@offroadtactical.com</a>
    </div>

  </section>
</main>

  © 2026 OFFROAD TACTICAL 
</footer>

<script>
// MAILTO HANDLER
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("contactForm");
  if (!form) return;

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message").value.trim();

    const subject = encodeURIComponent("OFFROAD TACTICAL Contact Form");

    const body = encodeURIComponent(
`Name: ${name}
Email: ${email}
Phone: ${phone}

Message:
${message}`
    );

    window.location.href = `mailto:sales@offroadtactical.com?subject=${subject}&body=${body}`;
  });
});
</script>

<script>
    (() => {
      const button = document.querySelector('.ot-menu-toggle');
      const menu = document.getElementById('ot-site-menu');
      function setOpen(open) {
        menu.hidden = !open;
        button.setAttribute('aria-expanded', String(open));
        button.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      }
      button.addEventListener('click', () => setOpen(menu.hidden));
      menu.addEventListener('click', event => { if (event.target.closest('a')) setOpen(false); });
      document.addEventListener('click', event => { if (!event.target.closest('.ot-site-header')) setOpen(false); });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !menu.hidden) { setOpen(false); button.focus(); }
      });
    })();
  </script>
