<style>
/* CONTACT PAGE CARD */
.contact-page{
  display:flex;
  justify-content:center;
  padding-top:32px;
  padding-bottom:48px;
}

.contact-card{
  width:100%;
  max-width:720px;
  padding:28px;
  border-radius:24px;
  background:linear-gradient(145deg, rgba(35,35,35,.96), rgba(8,8,8,.98));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
}

.contact-head{
  text-align:center;
  margin-bottom:24px;
}

.contact-head h1{
  margin:0 0 8px;
  letter-spacing:2px;
}

.contact-head p{
  margin:0;
  color:rgba(255,255,255,.72);
}

.contact-form{
  display:grid;
  gap:16px;
}

.contact-form label{
  color:#cfcfcf;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
  opacity:0.9;
}

.contact-form input,
.contact-form textarea{
  width:100%;
  box-sizing:border-box;
  border:none;
  outline:none;
  border-radius:14px;
  padding:14px 15px;
  background:rgba(255,255,255,.09);
  color:#fff;
  border:1px solid rgba(255,255,255,.14);
  font:inherit;
}

.contact-form input:focus,
.contact-form textarea:focus{
  border-color:rgba(255,255,255,.45);
  background:rgba(255,255,255,.13);
}

.contact-form textarea{
  resize:vertical;
  min-height:140px;
}

.contact-submit{
  margin-top:8px;
  border:none;
  border-radius:999px;
  padding:15px 18px;
  font-weight:900;
  letter-spacing:1.5px;
  cursor:pointer;
  color:#111;
  background:linear-gradient(135deg, #fff, #bdbdbd);
  box-shadow:0 8px 22px rgba(255,255,255,.14);
}

.contact-submit:hover{
  transform:translateY(-1px);
}

.contact-direct{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.12);
  text-align:center;
  color:rgba(255,255,255,.72);
}

.contact-direct a{
  color:#fff;
  font-weight:800;
  text-decoration:none;
  margin-left:6px;
}

@media(max-width:700px){
  .contact-card{
    padding:22px;
    border-radius:20px;
  }
}
</style>
</head>

  <a class="tab nav-tab" href="/">HOME</a>
  <a class="tab nav-tab" href="/humvee.html">HUMVEE</a>

<main class="container contact-page">
  <section class="contact-card">

    <div class="contact-head">
      <h1>CONTACT</h1>
      <p>Send us a message — your email app will open automatically.</p>
    </div>

    <form class="contact-form" id="contactForm">
      <label>
        Name
        <input type="text" id="name" required>
      </label>

      <label>
        Email
        <input type="email" id="email" required>
      </label>

      <label>
        Phone
        <input type="tel" id="phone">
      </label>

      <label>
        Message
        <textarea id="message" required></textarea>
      </label>

      <button type="submit" class="contact-submit">SEND MESSAGE</button>
    </form>

    <div class="contact-direct">
      <span>Or email directly:</span>
      <a href="mailto:sales@offroadtactical.com">sales@offroadtactical.com</a>
    </div>

  </section>
</main>

<footer class="footer">
  © 2025 OFFROAD TACTICAL — HUMVEE • JEEP • APPAREL • EDC
</footer>

<script>
// MAILTO HANDLER
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("contactForm");
  if (!form) return;

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message").value.trim();

    const subject = encodeURIComponent("OFFROAD TACTICAL Contact Form");

    const body = encodeURIComponent(
`Name: ${name}
Email: ${email}
Phone: ${phone}

Message:
${message}`
    );

    window.location.href = `mailto:sales@offroadtactical.com?subject=${subject}&body=${body}`;
  });
});
</script>

</body>
