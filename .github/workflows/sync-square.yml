name: Sync Square Olight and Osight
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/sync_square.py
      - name: Commit updated product catalog and images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gun-builder/square-products.json gun-builder/assets/square/
          if ! git diff --cached --quiet; then
            git commit -m 'Sync Square accessory photos and listings'
            git push
          fi
