<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OFFROAD TACTICAL Scan</title>

  <link rel="icon" type="image/png" href="assets/favicon_ot_white.ico">
  <link rel="stylesheet" href="styles.css">
  <script defer src="scripts.js"></script>

  <style>
    .scan-hero {
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      padding: 40px 0;
      text-align: center;
    }

    .scan-logo {
      width: min(320px, 80vw);
      margin: 0 auto 8px;
      display: block;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,.55));
    }

    .scan-title {
      font-size: clamp(32px, 7vw, 62px);
      margin: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .scan-subtitle {
      margin: 0 auto;
      max-width: 680px;
      color: rgba(255,255,255,.75);
      font-size: clamp(16px, 3vw, 22px);
      line-height: 1.4;
    }

    .scan-card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      width: 100%;
      max-width: 1100px;
      margin: 20px auto 0;
    }

    .scan-card {
      min-height: 230px;
      border-radius: 26px;
      padding: 28px 22px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.035)),
        radial-gradient(circle at top, rgba(255,255,255,.14), transparent 45%);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 18px 45px rgba(0,0,0,.45);
      text-decoration: none;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .scan-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,.38);
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }

    .scan-card img {
      max-width: 160px;
      max-height: 82px;
      object-fit: contain;
    }

    .scan-card-icon {
      font-size: 54px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .scan-card h2 {
      margin: 0;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .scan-card p {
      margin: 0;
      color: rgba(255,255,255,.7);
      font-size: 15px;
    }

    .scan-card-button {
      margin-top: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    @media (max-width: 850px) {
      .scan-card-grid {
        grid-template-columns: 1fr;
        max-width: 520px;
      }

      .scan-card {
        min-height: 180px;
      }
    }
  </style>
</head>



  <main class="container">
    <section class="scan-hero">
   

      <div class="scan-card-grid">
        <a class="scan-card" href="/" aria-label="Visit OFFROAD TACTICAL website">
          <img src="assets/3FA16524-2001-45BF-9F7D-3187CFAA1DA2.png" alt="OFFROAD TACTICAL logo">
          <h2>Website</h2>
          <p>Shop full inventory and product categories.</p>
          <span class="scan-card-button">Enter Site</span>
        </a>

        <a class="scan-card" href="https://ebay.us/m/Pz17oU" target="_blank" rel="noopener" aria-label="Visit OFFROAD TACTICAL eBay store">
          <div class="scan-card-icon">eBay</div>
          <h2>eBay Store</h2>
          <p>View available marketplace listings.</p>
          <span class="scan-card-button">Shop eBay</span>
        </a>

        <a class="scan-card" href="https://www.amazon.com/stores/YOUR-AMAZON-STORE" target="_blank" rel="noopener" aria-label="Visit OFFROAD TACTICAL Amazon store">
          <div class="scan-card-icon">amazon</div>
          <h2>Amazon Store</h2>
          <p>Browse products available on Amazon.</p>
          <span class="scan-card-button">Shop Amazon</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">© 2025 OFFROAD TACTICAL — HUMVEE • JEEP • AR-15 • CROSS-KARTS</footer>
</body>
</html>
