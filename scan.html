<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OFFROAD TACTICAL Scan</title>

  <link rel="icon" type="image/png" href="assets/favicon_ot_white.ico">
  <link rel="stylesheet" href="styles.css">
  <script defer src="scripts.js"></script>

  <style>
    body.scan-page{
      background-image:none !important;
      background:#e5e6e7 !important;
    }

    .scan-hero{
      min-height:calc(100vh - 160px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:28px;
      padding:40px 0;
      text-align:center;
    }

    .scan-card-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:22px;
      width:100%;
      max-width:900px;
      margin:20px auto 0;
    }

    .scan-card{
      min-height:220px;
      border-radius:12px;
      padding:22px;
      background:#fff;
      border:2px solid var(--border);
      box-shadow:0 8px 20px rgba(0,0,0,.15);
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:14px;
    }

    .scan-card img{
      max-width:160px;
      margin:0 auto;
    }

    .scan-card h2{
      margin:0;
      font-size:24px;
      background:none;
      border:none;
      clip-path:none;
      padding:0;
    }

    .scan-card p{
      font-size:14px;
      color:#555;
      margin:0;
    }

    .scan-buttons{
      display:grid;
      gap:10px;
      margin-top:10px;
    }

    @media (max-width:850px){
      .scan-card-grid{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body class="scan-page">

  <main class="container">
    <section class="scan-hero">

      <div class="scan-card-grid">

        <!-- WEBSITE -->
        <div class="scan-card">
          <img src="assets/3FA16524-2001-45BF-9F7D-3187CFAA1DA2.png">
          <h2>Website</h2>
          <p>Full inventory and categories</p>

          <div class="scan-buttons">
            <a href="https://offroad-tactical.square.site/s/shop?page=1&limit=30&sort_by=popularity_score&sort_order=desc&location_id=LSTMGT262XWZ2"
               class="btn">ENTER SITE</a>
          </div>
        </div>

        <!-- AMAZON -->
        <div class="scan-card">
          <h2>Amazon</h2>
          <p>Shop via Amazon marketplace</p>

          <div class="scan-buttons">
            <a href="https://amazon.com/s?me=A1HXZAOCYFAB0V&ref=sf_seller_app_share_new"
               target="_blank"
               class="marketplace-btn amazon-btn">
               BUY ON AMAZON
            </a>
          </div>
        </div>

        <!-- EBAY -->
        <div class="scan-card">
          <h2>eBay</h2>
          <p>View active listings</p>

          <div class="scan-buttons">
            <a href="https://ebay.us/m/Pz17oU"
               target="_blank"
               class="marketplace-btn ebay-btn">
               BUY ON
               <span class="ebay-e">E</span><span class="ebay-b">B</span><span class="ebay-a">A</span><span class="ebay-y">Y</span>
            </a>
          </div>
        </div>

      </div>

    </section>
  </main>

  <footer class="footer">
    © 2025 OFFROAD TACTICAL — HUMVEE • JEEP • AR-15 • CROSS-KARTS
  </footer>

</body>
</html>
