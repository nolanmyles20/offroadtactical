<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OFFROAD TACTICAL — Commercial Player</title>

  <link rel="icon" href="/assets/favicon_ot_white.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon_ot_white.png" sizes="256x256">
  <link rel="apple-touch-icon" href="/assets/favicon_ot_white.png">

  <link rel="stylesheet" href="commercial.css">
  <script defer src="commercial.js"></script>

  <style>
    .commercial-shop-actions{
      display:grid;
      gap:10px;
      width:min(320px,calc(100% - 32px));
      margin:14px auto 0;
      position:relative;
      z-index:2;
    }

    .commercial-shop-actions .btn{
      display:block;
      padding:12px 18px;
      border:2px solid #111;
      border-radius:8px;
      background:#fff;
      color:#111;
      font-weight:700;
      text-align:center;
      text-decoration:none;
      text-transform:uppercase;
    }

    .commercial-shop-actions .btn:hover,
    .commercial-shop-actions .btn:focus-visible{
      background:#111;
      color:#fff;
    }
  </style>
</head>

<body>
  <main id="commercial-player" class="commercial-player" aria-label="Commercial media player">
    <div id="media-stage" class="media-stage" aria-live="off"></div>

    <div class="commercial-shop-actions">
      <a href="https://offroad-tactical.square.site/s/shop?page=1&amp;limit=30&amp;sort_by=popularity_score&amp;sort_order=desc&amp;location_id=LSTMGT262XWZ2"
         class="btn">SHOP NOW</a>
    </div>

    <div id="start-overlay" class="start-overlay" hidden>
      <img
        class="start-logo"
        src="assets/3FA16524-2001-45BF-9F7D-3187CFAA1DA2.png"
        alt="Offroad Tactical"
      >
      <button id="start-button" class="start-button" type="button">
        START FULLSCREEN
      </button>
      <p>Press Esc at any time to leave fullscreen.</p>
    </div>

    <button id="fullscreen-button" class="fullscreen-button" type="button" aria-label="Enter fullscreen">
      ⛶
    </button>

    <div id="player-message" class="player-message" hidden></div>
  </main>
</body>
</html>
